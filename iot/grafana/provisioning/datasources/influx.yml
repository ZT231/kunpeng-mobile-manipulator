apiVersion: 1
datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: robotics
      defaultBucket: telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: robotics_admin_token_2026
    editable: true
