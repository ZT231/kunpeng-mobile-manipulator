# 移动操作机器人 · IoT 栈最小闭环
# 架构: 真实遥测桥 --MQTT--> EMQX --(eKuiper 规则引擎)--> InfluxDB --Grafana 看板
# 平台: KunPeng Pro (openEuler 22.03, aarch64) + Docker 19.03.14 / docker-compose 1.22.0 (V1)
#
# 两个板上实测约束（2026-11-08 阶段 1.1 踩过，别删）:
#   ① 必须显式写 version: "2.4"。V1 的 docker-compose 在没有 version 时按 v1 文件格式
#      解析，连 services: 都不认；而 2.4 是同时支持 healthcheck 与
#      depends_on: condition: service_healthy 的最后一版（v3 移除过 condition）。
#   ② 四个服务都要 security_opt: [seccomp=unconfined]。本机 Docker 19.03.14 的默认
#      seccomp profile 不含 clone3，新镜像里 glibc >= 2.34 的 pthread_create()
#      改用 clone3(2) 会被 EPERM 拒，容器起来就 Exited (1)。阶段 1.1 的 EMQX
#      首行日志 "Failed to create thread: Operation not permitted (1)" 已实证；
#      其余三个镜像按同类风险预防性统一加上。
#      正解是升 Docker >= 20.10.10 或自定义 profile 只放行 clone3；官方源只有
#      19.03.14、引第三方源有依赖冲突，本地实验用 unconfined 是明确的安全取舍
#      （等于撤掉该容器的系统调用过滤层），见 iot/README.md 第 0 节。

version: "2.4"

networks:
  iot:
    driver: bridge

volumes:
  emqx-data:
  ekuiper-data:
  influxdb-data:
  grafana-data:

services:
  # ---- MQTT Broker (边网关) ----
  emqx:
    image: emqx:5.8.8
    container_name: emqx
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    ports:
      - "1883:1883"      # MQTT 设备/客户端接入
      - "18083:18083"    # EMQX Web 控制台 (admin / robotics123)
    environment:
      EMQX_DASHBOARD__DEFAULT__PASSWORD: "robotics123"
      EMQX_NODE__NAME: "emqx@127.0.0.1"
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [iot]
    volumes:
      - emqx-data:/opt/emqx/data

  # ---- 边缘规则引擎 (eKuiper) ----
  ekuiper:
    image: lfedge/ekuiper:2.1.0-full
    container_name: ekuiper
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    ports:
      - "9081:9081"      # eKuiper REST API
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://emqx:1883"
    depends_on:
      emqx:
        condition: service_healthy
    networks: [iot]
    volumes:
      - ekuiper-data:/kuiper/data

  # ---- 时序数据库 (InfluxDB 2.x) ----
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    ports:
      - "8087:8086"      # InfluxDB HTTP API (宿主机 8086 被 DevKit nginx 占用, 见 README 第 4 节)
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "admin"
      DOCKER_INFLUXDB_INIT_PASSWORD: "robotics123"
      DOCKER_INFLUXDB_INIT_ORG: "robotics"
      DOCKER_INFLUXDB_INIT_BUCKET: "telemetry"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "robotics_admin_token_2026"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [iot]
    volumes:
      - influxdb-data:/var/lib/influxdb2

  # ---- 看板 (Grafana) ----
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    ports:
      - "3000:3000"      # Grafana Web (admin / robotics123)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "robotics123"
    depends_on:
      influxdb:
        condition: service_healthy
    networks: [iot]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
